<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Feedback Sent | AgroSense Dynamics
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .success-page {

            min-height: 80vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

        }


        .success-card {

            width: min(600px, 100%);

            padding: 50px 35px;

            text-align: center;

        }


        .success-icon {

            width: 90px;

            height: 90px;

            margin: 0 auto 25px;

            display: grid;

            place-items: center;

            border-radius: 50%;

            font-size: 45px;

            background:
                rgba(109, 255, 159, 0.10);

            border:
                1px solid
                rgba(109, 255, 159, 0.3);

            animation:
                successPulse 2s ease-in-out infinite;

        }


        @keyframes successPulse {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

        }


        .success-card h1 {

            font-size:
                clamp(38px, 6vw, 58px);

            margin-bottom: 18px;

        }


        .success-card p {

            color: var(--muted);

            line-height: 1.8;

        }

    </style>

</head>


<body>


<nav class="navbar">

    <a href="index.html" class="logo">

        <span class="logo-icon">
            A
        </span>

        <span>
            AgroSense
            <span>Dynamics</span>
        </span>

    </a>

</nav>


<main class="success-page">

    <section class="success-card glass reveal">

        <div class="success-icon">
            ✓
        </div>

        <div class="badge">
            FEEDBACK RECEIVED
        </div>

        <h1>

            Thank
            <span class="gradient">
                You!
            </span>

        </h1>

        <p>

            Your feedback has been successfully
            submitted to AgroSense Dynamics.

            <br><br>

            Your suggestions will help us improve
            the system.

        </p>


        <a
            href="overview.html"
            class="btn primary"
        >
            Back to Overview
            <span>→</span>
        </a>

    </section>

</main>


<footer>

    © 2026 AgroSense Dynamics.
    All Rights Reserved.

</footer>


</body>
</html>
