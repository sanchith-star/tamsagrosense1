<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AgroSense Dynamics | Feedback
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<nav class="navbar">

    <a href="index.html" class="logo">

        <span class="logo-icon">
            A
        </span>

        <span>
            AgroSense
            <span>Dynamics</span>
        </span>

    </a>


    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="overview.html">
            Overview
        </a>

        <a href="peacock.html">
            Peacock
        </a>

        <a href="theft.html">
            Motor Theft
        </a>

        <a href="snake.html">
            Snake
        </a>

        <a href="order.html">
            Order
        </a>

        <a
            href="feedback.html"
            class="active"
        >
            Feedback
        </a>

    </div>

</nav>


<section class="page-header">

    <div class="badge">
        YOUR FEEDBACK MATTERS
    </div>

    <h1>

        Help us
        <span class="gradient">
            improve.
        </span>

    </h1>

    <p>
        Tell us what you think about AgroSense
        Dynamics and what improvements you would
        like to see.
    </p>

</section>


<main>

    <section class="feedback glass">


        <!-- FORMSUBMIT -->

        <form
            action="https://formsubmit.co/agrosensedynamics@gmail.com"
            method="POST"
        >


            <input
                type="hidden"
                name="_subject"
                value="AGROSENSE DYNAMICS FEEDBACK"
            >


            <input
                type="hidden"
                name="_template"
                value="table"
            >


            <input
                type="hidden"
                name="_captcha"
                value="true"
            >


            <input
                type="hidden"
                name="_next"
                value="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/feedback-success.html"
            >


            <!-- NAME -->

            <label for="feedbackName">
                Name
            </label>

            <input
                type="text"
                id="feedbackName"
                name="Name"
                placeholder="Enter your name"
                required
            >


            <!-- RATING -->

            <label>
                Rating
            </label>


            <div class="stars">

                <button
                    type="button"
                    class="star"
                    data-rating="1"
                    aria-label="1 star"
                >
                    ★
                </button>

                <button
                    type="button"
                    class="star"
                    data-rating="2"
                    aria-label="2 stars"
                >
                    ★
                </button>

                <button
                    type="button"
                    class="star"
                    data-rating="3"
                    aria-label="3 stars"
                >
                    ★
                </button>

                <button
                    type="button"
                    class="star"
                    data-rating="4"
                    aria-label="4 stars"
                >
                    ★
                </button>

                <button
                    type="button"
                    class="star"
                    data-rating="5"
                    aria-label="5 stars"
                >
                    ★
                </button>

            </div>


            <!-- IMPORTANT:
                 Hidden field receives rating -->

            <input
                type="hidden"
                id="rating"
                name="Star Rating"
                value=""
                required
            >


            <!-- IMPROVEMENTS -->

            <label for="improvements">
                Improvements Needed
            </label>

            <textarea
                id="improvements"
                name="Improvements Needed"
                placeholder="Tell us what we can improve..."
                required
            ></textarea>


            <!-- FAVORITE PART -->

            <label for="favorite">
                Favorite Part
            </label>

            <textarea
                id="favorite"
                name="Favorite Part"
                placeholder="What did you like most?"
            ></textarea>


            <div class="button-row">

                <button
                    type="submit"
                    class="btn primary"
                >
                    Send Feedback
                    <span>→</span>
                </button>


                <button
                    type="reset"
                    class="btn btn-reset"
                    onclick="resetStars()"
                >
                    Reset
                </button>

            </div>

        </form>

    </section>

</main>


<footer>

    © 2026 AgroSense Dynamics.
    All Rights Reserved.

</footer>


<script>

const stars =
    document.querySelectorAll(".star");

const ratingInput =
    document.getElementById("rating");


stars.forEach(function(star) {

    star.addEventListener("click", function() {

        const rating =
            Number(this.dataset.rating);


        ratingInput.value =
            rating + " / 5";


        stars.forEach(function(item) {

            if (
                Number(item.dataset.rating)
                <= rating
            ) {

                item.classList.add("active");

            } else {

                item.classList.remove("active");

            }

        });

    });

});


function resetStars() {

    ratingInput.value = "";

    stars.forEach(function(star) {

        star.classList.remove("active");

    });

}

</script>


</body>
</html>
